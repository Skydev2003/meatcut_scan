name: meatcut_scan
description: "MeatCut Scan - AI-powered meat classification app with on-device learning"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Routing
  go_router: ^14.2.0
  
  # Backend & Auth
  supabase_flutter: ^2.5.6
  
  # AI & ML
  tflite_flutter: ^0.10.4
  image: ^4.2.0
  
  # Camera & Image Picker
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  
  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  
  # UI
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/images/
